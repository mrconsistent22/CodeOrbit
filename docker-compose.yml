services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codeorbit
      POSTGRES_PASSWORD: codeorbit
      POSTGRES_DB: codeorbit
    ports:
      - "5432:5432"
    volumes:
      - codeorbit-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  codeorbit-postgres:
